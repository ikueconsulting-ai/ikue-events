name: Update Agricultural Events

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - List files
        run: |
          echo "Current directory:"
          pwd
          echo "Contents of scripts directory:"
          ls -la scripts/ || echo "scripts directory not found"
          echo "Current git branch:"
          git branch -a
          echo "Current git ref:"
          git rev-parse HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Script
        run: |
          echo "Running update-events.js..."
          node scripts/update-events.js

      - name: Commit Changes
        run: |
          git config --global user.name "Ikue Event Bot"
          git config --global user.email "bot@ikueconsulting.com"

          git add .

          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update events"

          git push
